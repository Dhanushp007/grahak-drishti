name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-structure:
    name: Validate repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required paths
        shell: bash
        run: |
          set -euo pipefail
          required_paths=(
            "apps/citizen-web"
            "apps/admin-dashboard"
            "services/api"
            "services/ai"
            "services/clustering_worker"
            "services/complaint_worker"
            "services/routing_engine"
            "data/seed"
            "infrastructure/postgres"
            ".github/agents"
            ".github/instructions"
            ".github/workflows"
          )

          for path in "${required_paths[@]}"; do
            test -d "$path"
          done

          required_files=(
            ".github/agents/architect.agent.md"
            ".github/agents/backend.agent.md"
            ".github/agents/frontend.agent.md"
            ".github/agents/ai.agent.md"
            ".github/agents/reviewer.agent.md"
            ".github/instructions/backend.instructions.md"
            ".github/instructions/frontend.instructions.md"
            ".github/instructions/database.instructions.md"
            ".github/instructions/ai.instructions.md"
            ".github/instructions/testing.instructions.md"
          )

          for path in "${required_files[@]}"; do
            test -f "$path"
          done

  python:
    name: Validate Python API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint API and workers
        run: python -m ruff check services/api services/ai services/clustering_worker services/complaint_worker services/routing_engine scripts

      - name: Type check API and workers
        run: python -m mypy services/api/app services/ai/app services/clustering_worker/app services/complaint_worker services/routing_engine/app scripts

      - name: Test API
        run: python -m pytest

      - name: Validate database migrations
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          python -m alembic upgrade head
          test -f ci-migrations.db
          rm ci-migrations.db
          python -m alembic upgrade head
          python -m scripts.seed_demo --reset
          python -m scripts.validate_demo_data
          rm ci-migrations.db

  scale-demo:
    name: Validate synthetic scale simulation
    runs-on: ubuntu-latest
    needs: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run 100 to 100,000 event simulation
        run: python scripts/load_simulation.py --events 100 1000 10000 100000 --workers 4

  smoke:
    name: Run API smoke test
    runs-on: ubuntu-latest
    needs: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run live API smoke test
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/grahak-drishti-smoke.db
        run: |
          set -euo pipefail
          smoke_db="${{ runner.temp }}/grahak-drishti-smoke.db"
          trap 'rm -f "$smoke_db"' EXIT
          python -m alembic upgrade head
          python scripts/api_smoke_test.py

  demo-flow:
    name: Validate seeded demo flow
    runs-on: ubuntu-latest
    needs: python
    env:
      DEMO_BASE_URL: http://127.0.0.1:8002
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Prepare deterministic demo database
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/grahak-drishti-demo.db
        run: |
          python -m alembic upgrade head
          python -m scripts.seed_demo --reset

      - name: Run seeded HTTP demo flow
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/grahak-drishti-demo.db
        run: |
          set -euo pipefail
          python -m uvicorn services.api.app.main:app --host 127.0.0.1 --port 8002 &
          server_pid=$!
          python -m services.complaint_worker.app.worker --interval 0.1 &
          worker_pid=$!
          trap 'kill "$server_pid" "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8002/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8002/health >/dev/null
          python scripts/demo_smoke_test.py

  citizen-web:
    name: Validate citizen web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/citizen-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/citizen-web/package-lock.json

      - name: Install citizen web dependencies
        run: npm ci

      - name: Test citizen web contracts
        run: npm test

      - name: Lint citizen web
        run: npm run lint

      - name: Build citizen web
        run: npm run build

  admin-dashboard:
    name: Validate admin dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin-dashboard/package-lock.json

      - name: Install admin dashboard dependencies
        run: npm ci

      - name: Test dashboard contracts
        run: npm test

      - name: Lint admin dashboard
        run: npm run lint

      - name: Build admin dashboard
        run: npm run build

  browser-e2e:
    name: Validate browser golden journey
    runs-on: ubuntu-latest
    needs: [python, citizen-web, admin-dashboard]
    env:
      API_ORIGIN: http://127.0.0.1:8003
      CITIZEN_BASE_URL: http://127.0.0.1:3005
      ADMIN_BASE_URL: http://127.0.0.1:3006
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/citizen-web/package-lock.json

      - name: Install dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          npm ci --prefix apps/citizen-web
          npm ci --prefix apps/admin-dashboard
          (cd apps/citizen-web && npx playwright install --with-deps chromium)

      - name: Seed database, start services, and run browser journey
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/grahak-drishti-browser.db
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          set -euo pipefail
          python -m alembic upgrade head
          python -m scripts.seed_demo --reset
          python -m uvicorn services.api.app.main:app --host 127.0.0.1 --port 8003 &
          api_pid=$!
          python -m services.complaint_worker.app.worker --interval 0.1 &
          worker_pid=$!
          (cd apps/citizen-web && npm run dev -- --port 3005) &
          citizen_pid=$!
          (cd apps/admin-dashboard && npm run dev -- --port 3006) &
          admin_pid=$!
          trap 'kill "$api_pid" "$worker_pid" "$citizen_pid" "$admin_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8003/health >/dev/null && \
              curl --fail --silent http://127.0.0.1:3005/ >/dev/null && \
              curl --fail --silent http://127.0.0.1:3006/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8003/health >/dev/null
          curl --fail --silent http://127.0.0.1:3005/ >/dev/null
          curl --fail --silent http://127.0.0.1:3006/ >/dev/null
          (cd apps/citizen-web && npm run e2e)