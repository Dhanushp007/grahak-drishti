name: CI

on:
  push:
  pull_request:

jobs:
  repository-structure:
    name: Validate repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required paths
        shell: bash
        run: |
          set -euo pipefail
          required_paths=(
            "apps/citizen-web"
            "apps/admin-dashboard"
            "services/api"
            "services/ai"
            "services/clustering-worker"
            "services/complaint-worker"
            "services/notification-worker"
            "services/routing-engine"
            "packages/schemas"
            "packages/rules"
            "packages/ui"
            "data/regulatory-kb"
            "data/seed"
            "data/synthetic"
            "infrastructure/kafka"
            "infrastructure/minio"
            "infrastructure/monitoring"
            "infrastructure/opensearch"
            "infrastructure/postgres"
            "docs/api"
            "docs/architecture"
            "docs/prd"
            ".github/agents"
            ".github/instructions"
            ".github/workflows"
          )

          for path in "${required_paths[@]}"; do
            test -d "$path"
          done

          required_files=(
            ".github/agents/architect.agent.md"
            ".github/agents/backend.agent.md"
            ".github/agents/frontend.agent.md"
            ".github/agents/ai.agent.md"
            ".github/agents/reviewer.agent.md"
            ".github/instructions/backend.instructions.md"
            ".github/instructions/frontend.instructions.md"
            ".github/instructions/database.instructions.md"
            ".github/instructions/ai.instructions.md"
            ".github/instructions/testing.instructions.md"
          )

          for path in "${required_files[@]}"; do
            test -f "$path"
          done

  python:
    name: Validate Python API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint API
        run: python -m ruff check services/api services/ai scripts/api_smoke_test.py

      - name: Type check API
        run: python -m mypy services/api/app services/ai/app scripts/api_smoke_test.py

      - name: Test API
        run: python -m pytest

      - name: Validate database migrations
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          python -m alembic upgrade head
          test -f ci-migrations.db
          rm ci-migrations.db

  smoke:
    name: Run API smoke test
    runs-on: ubuntu-latest
    needs: python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run live API smoke test
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/grahak-drishti-smoke.db
        run: |
          set -euo pipefail
          smoke_db="${{ runner.temp }}/grahak-drishti-smoke.db"
          trap 'rm -f "$smoke_db"' EXIT
          python -m alembic upgrade head
          python scripts/api_smoke_test.py

  citizen-web:
    name: Validate citizen web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/citizen-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/citizen-web/package-lock.json

      - name: Install citizen web dependencies
        run: npm ci

      - name: Test citizen web contracts
        run: npm test

      - name: Lint citizen web
        run: npm run lint

      - name: Build citizen web
        run: npm run build